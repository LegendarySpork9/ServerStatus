name: CI on Pull Request

on:
  pull_request:
    branches:
      - '**'

permissions:
  statuses: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Run tests with coverage
      run: dotnet test --configuration Release --no-restore --verbosity normal --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: reportgenerator -reports:"./TestResults/**/coverage.cobertura.xml" -targetdir:"./TestResults/CoverageReport" -reporttypes:"Cobertura;JsonSummary"

    - name: Post coverage status
      if: github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        COVERAGE=$(python3 -c "
        import json
        with open('./TestResults/CoverageReport/Summary.json') as f:
            data = json.load(f)
        print(round(data['summary']['linecoverage'], 1))
        ")

        echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

        echo "### Code Coverage" >> "$GITHUB_STEP_SUMMARY"
        echo "Line coverage: **${COVERAGE}%**" >> "$GITHUB_STEP_SUMMARY"

        gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
          -f state="success" \
          -f context="code-coverage" \
          -f description="Line coverage: ${COVERAGE}%" \
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./TestResults/CoverageReport/

    - name: Publish Site
      run: >
        dotnet publish
        "ServerStatusSite/ServerStatusSite.csproj"
        -c Release
        -o ./artifacts/ServerStatusSite

    - name: Publish Reporter
      run: >
        dotnet publish
        "ServerStatusReporter/ServerStatusReporter.csproj"
        -c Release
        -o ./artifacts/ServerStatusReporter

    - name: Publish Automation
      run: >
        dotnet publish
        "ServerStatusAutomation/ServerStatusAutomation.csproj"
        -c Release
        -o ./artifacts/ServerStatusAutomation

    - name: Set Build Timestamp
      id: timestamp
      shell: bash
      run: echo "value=$(date -u +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

    - name: Upload Site Artefact
      uses: actions/upload-artifact@v4
      with:
        name: ServerStatusSite_${{ steps.timestamp.outputs.value }}
        path: ./artifacts/ServerStatusSite

    - name: Upload Reporter Artefact
      uses: actions/upload-artifact@v4
      with:
        name: ServerStatusReporter_${{ steps.timestamp.outputs.value }}
        path: ./artifacts/ServerStatusReporter

    - name: Upload Automation Artefact
      uses: actions/upload-artifact@v4
      with:
        name: ServerStatusAutomation_${{ steps.timestamp.outputs.value }}
        path: ./artifacts/ServerStatusAutomation
